name: Check Dependencies

on:
  push:
    branches:
      - feature/solution
  pull_request:
    branches:
      - feature/solution

jobs:
  check-dependencies:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e .
    
    - name: Run setup.py
      run: python setup.py develop